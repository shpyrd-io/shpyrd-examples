# Rails with PostgreSQL. Before the first deploy:
#   shpyrd pg create db --project example-rails
#   shpyrd attach db --project example-rails            # sets DATABASE_URL
#   shpyrd secrets set SECRET_KEY_BASE=$(openssl rand -hex 64) --project example-rails
# The Procfile's release: line runs `rails db:prepare` before each rollout.
project: example-rails
env:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
processes:
  web:
    size: shared-m
    healthCheck:
      path: /up
