# Java: the Java buildpack builds with Maven and runs the jar. The JVM
# wants more memory than the default size, and Paketo's memory calculator
# sizes the heap from the instance memory and the thread count: 512Mi
# with its default of 250 threads does not add up, so the count is set.
project: example-java
processes:
  web:
    size: shared-l
build:
  env:
    BP_JVM_VERSION: "21"
env:
  BPL_JVM_THREAD_COUNT: "50"
